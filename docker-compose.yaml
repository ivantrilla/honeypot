version : '3'
services:
  
  nginx:
    image: nginx:1-alpine
    restart: always
    volumes:
      - ./nginx-config:/etc/nginx
      - ./honeypot-static-content:/var/www/static
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - app-network
    ports:
      - "80:80"
      - "443:443"

  honeypot:
    image: honeypot:1.0
    restart: always
    environment:
      - ENV_DATABASE
      - ENV_USER
      - ENV_PASSWORD
    ports:
      - "8000:8000"
    networks:
      - app-network

  postgres:
    image: postgres:14-alpine
    restart: always
    volumes:
    - ./postgres-data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: ${ENV_DATABASE}
      POSTGRES_USER: ${ENV_USER}
      POSTGRES_PASSWORD: ${ENV_PASSWORD}
    ports:
      - "5432:5432"
    networks:
      - app-network


networks:
  app-network:
    driver: bridge
